name: Build Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r windows/requirements.txt pyinstaller

      - name: Self test
        run: |
          python -c "import dxcam, mss, numpy, tkinter; print('imports ok')"
          python windows/disko.py --selftest

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name Disko windows/disko.py

      - uses: actions/upload-artifact@v4
        with:
          name: Disko-windows
          path: dist/Disko.exe
